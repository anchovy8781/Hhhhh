[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerdev"
version = "0.1.0"
description = "Developer tool for driving programmable power devices (PSUs, electronic loads) over SCPI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
powerdev = "powerdev.cli:main"

[tool.setuptools]
packages = ["powerdev", "powerdev.transports", "powerdev.drivers"]
